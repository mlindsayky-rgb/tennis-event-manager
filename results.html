<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Week's Results</title>
<style>
  :root {
    --court: #1A5C2A; --court-light: #2E8540; --navy: #0F1F3D;
    --ink: #18181B; --ink-muted: #71717A; --border: #E4E4E7; --surface: #FAFAF7; --clay: #C0392B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--surface); color: var(--ink); }
  header { background: linear-gradient(135deg, var(--navy) 0%, var(--court) 100%); color: #fff; padding: 20px 20px 16px; }
  header h1 { margin: 0; font-size: 20px; }
  header .sub { font-size: 13px; opacity: .85; margin-top: 4px; }
  .content { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
  .site-header { padding: 12px 16px; background: #F4F4F2; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 14px; }
  .site-sub { font-size: 12px; color: var(--ink-muted); font-weight: 500; margin-top: 2px; }
  .court-row { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .court-row:last-child { border-bottom: none; }
  .court-num { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
  .side { font-size: 14px; }
  .side.winner { font-weight: 700; color: var(--court); }
  .side.loser { color: var(--ink-muted); }
  .score { font-size: 13px; color: var(--ink-muted); white-space: nowrap; font-family: Georgia, serif; }
  .score strong { color: var(--ink); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-muted); }
  .empty-state .big { font-size: 40px; margin-bottom: 12px; }
  .empty-state .title { font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--ink-muted); }
  footer { text-align: center; padding: 16px; font-size: 12px; color: var(--ink-muted); cursor: pointer; }
  #picker-list { max-width: 480px; margin: 40px auto; padding: 0 16px; }
  .picker-event { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; font-weight: 600; }
  .picker-event:hover { border-color: var(--court); }
</style>
</head>
<body>

<header>
  <h1 id="league-name">Loading…</h1>
  <div class="sub" id="week-label">—</div>
</header>
<div class="content" id="content"><div class="loading">Loading…</div></div>
<footer id="refresh-footer" style="display:none" onclick="loadResults()">Updated <span id="refresh-time">—</span> · tap to refresh</footer>

<script type="module">
  const SUPABASE_URL = 'https://vrnvhrruvzcnslvceacn.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZybnZocnJ1dnpjbnNsdmNlYWNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MDUwMjgsImV4cCI6MjA5NzE4MTAyOH0.Q7nH6aYILrUewrnmoi5AHK8XNrMoNEeAILIgRxeEaAQ';
  let createClient;
  try { ({ createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm')); }
  catch (e) { ({ createClient } = await import('https://esm.sh/@supabase/supabase-js@2.39.3')); }
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  const REFRESH_INTERVAL = 60000;
  let activeLeagueId = null;
  let activeWeek = null;

  function escQ(s) { return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
  function fmtDateFull(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' }); }
  function fmtTime(t) {
    if (!t) return '—';
    const [h,m] = t.split(':').map(Number);
    const period = h>=12?'PM':'AM';
    const h12 = h%12===0?12:h%12;
    return `${h12}:${String(m).padStart(2,'0')} ${period}`;
  }
  function siteLine(date, time, club) { return `${fmtDateFull(date)} · ${fmtTime(time)} · ${escQ(club||'—')}`; }

  function seasonWeekDates(league) {
    const start = new Date(league.start_date + 'T00:00:00');
    const weeks = [];
    for (let w=1; w<=league.session_length_weeks; w++) {
      const d = new Date(start); d.setDate(d.getDate() + (w-1)*7);
      weeks.push({ weekNumber: w, weekStart: d });
    }
    return weeks;
  }
  function dateForTeamInWeek(weekStart, timeSlotDay) {
    const d = new Date(weekStart);
    let diff = timeSlotDay - d.getDay();
    if (diff < 0) diff += 7;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function toISODate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function isMatchWeek(league, weekNumber) { return !league.alternate_practice_weeks || weekNumber % 2 === 0; }

  function currentWeekNumber(league) {
    const today = new Date(); today.setHours(0,0,0,0);
    const start = new Date(league.start_date + 'T00:00:00');
    const diffDays = Math.floor((today - start) / 86400000);
    let week = Math.floor(diffDays / 7) + 1;
    if (week < 1) week = 1;
    if (week > league.session_length_weeks) week = league.session_length_weeks;
    return week;
  }

  function setWinner(s) {
    if (!s.is_complete) return null;
    const a = Number(s.team_a_games)||0, b = Number(s.team_b_games)||0;
    return a>b ? 'A' : b>a ? 'B' : null;
  }
  function scoreCourt(cr) {
    let aSets=0, bSets=0, aGames=0, bGames=0;
    (cr.sets||[]).forEach(s => {
      aGames += Number(s.team_a_games)||0; bGames += Number(s.team_b_games)||0;
      const w = setWinner(s); if (w==='A') aSets++; else if (w==='B') bSets++;
    });
    let winner = null;
    if (aSets !== bSets) winner = aSets>bSets?'A':'B';
    else if (aGames !== bGames) winner = aGames>bGames?'A':'B';
    const setScores = (cr.sets||[]).map(s => `${s.team_a_games}-${s.team_b_games}`).join(', ');
    return { winner, setScores };
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    activeLeagueId = params.get('league');
    activeWeek = params.get('week') ? parseInt(params.get('week')) : null;
    if (activeLeagueId) { startRefresh(); return; }
    await showLeaguePicker();
  }

  async function showLeaguePicker() {
    const { data: leagues } = await sb.from('leagues').select('id,name,end_date').order('created_at', { ascending: false }).limit(20);
    document.getElementById('league-name').textContent = "This Week's Results";
    document.getElementById('week-label').textContent = 'Pick a league';
    const el = document.getElementById('content');
    if (!leagues?.length) { el.innerHTML = '<div class="empty-state"><div class="title">No leagues found</div></div>'; return; }
    if (leagues.length === 1) { activeLeagueId = leagues[0].id; startRefresh(); return; }
    el.innerHTML = '<div id="picker-list">' + leagues.map(l =>
      `<div class="picker-event" onclick="window.selectLeague('${l.id}')">${escQ(l.name)}</div>`
    ).join('') + '</div>';
    window.selectLeague = (id) => { activeLeagueId = id; startRefresh(); };
  }

  function startRefresh() {
    loadResults();
    clearInterval(window.__refreshTimer);
    window.__refreshTimer = setInterval(loadResults, REFRESH_INTERVAL);
  }

  async function loadResults() {
    if (!activeLeagueId) return;
    const { data: league } = await sb.from('leagues').select('*').eq('id', activeLeagueId).maybeSingle();
    if (!league) { showEmpty('League not found', ''); return; }
    document.getElementById('league-name').textContent = league.name;

    const week = activeWeek || currentWeekNumber(league);
    document.getElementById('week-label').textContent = `Week ${week} of ${league.session_length_weeks}`;

    if (!isMatchWeek(league, week)) {
      renderPracticeWeek(league, week);
      return;
    }

    const { data: matches } = await sb.from('league_matches').select('*').eq('league_id', league.id).eq('week_number', week);
    if (!matches?.length) { showEmpty('No matches yet', `Week ${week} hasn't been scheduled yet.`); return; }

    const teamIds = [...new Set(matches.flatMap(m => m.team_b_id ? [m.team_a_id, m.team_b_id] : [m.team_a_id]))];
    const { data: teams } = await sb.from('league_teams').select('*,clubs(name)').in('id', teamIds);
    const teamById = {}; (teams||[]).forEach(t => teamById[t.id] = t);

    const matchIds = matches.map(m => m.id);
    const { data: results } = matchIds.length ? await sb.from('court_results').select('*').in('match_id', matchIds) : { data: [] };
    const resultsByMatch = {};
    (results||[]).forEach(r => { (resultsByMatch[r.match_id] = resultsByMatch[r.match_id]||[]).push(r); });

    const playerIds = [...new Set((results||[]).flatMap(r => [r.team_a_player1_id, r.team_a_player2_id, r.team_b_player1_id, r.team_b_player2_id].filter(Boolean)))];
    const { data: players } = playerIds.length ? await sb.from('players').select('id,roster_name').in('id', playerIds) : { data: [] };
    const nameById = {}; (players||[]).forEach(p => nameById[p.id] = p.roster_name);

    const isDoubles = league.format === 'DOUBLES';
    const sideLabel = (p1, p2) => {
      const n1 = nameById[p1] || '—';
      return (isDoubles && p2) ? `${n1} / ${nameById[p2]||'—'}` : n1;
    };

    const sites = [];
    const addSite = (club, date, time, courts) => { if (courts.length) sites.push({ club, date, time, courts }); };
    matches.forEach(m => {
      const teamA = teamById[m.team_a_id], teamB = m.team_b_id ? teamById[m.team_b_id] : null;
      const courtResults = (resultsByMatch[m.id]||[]).sort((a,b)=>a.court_number-b.court_number);
      if (teamB) {
        const siteACourts = new Set(m.site_a_courts||[]);
        addSite(teamA?.clubs?.name || teamA?.name, m.site_a_date, teamA?.time_slot_time, courtResults.filter(r => siteACourts.has(r.court_number)));
        addSite(teamB?.clubs?.name || teamB?.name, m.site_b_date, teamB?.time_slot_time, courtResults.filter(r => !siteACourts.has(r.court_number)));
      } else {
        addSite(teamA?.clubs?.name || teamA?.name, m.site_a_date, teamA?.time_slot_time, courtResults);
      }
    });
    sites.sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.time||'').localeCompare(b.time||''));

    if (!sites.length) { showEmpty('No scores entered yet', `Check back once this week's matches are played.`); return; }

    const el = document.getElementById('content');
    el.innerHTML = sites.map(site => `
      <div class="card">
        <div class="site-header">${escQ(site.club)}<div class="site-sub">${siteLine(site.date, site.time, site.club).replace(` · ${escQ(site.club)}`,'')}</div></div>
        ${site.courts.map(cr => {
          const { winner, setScores } = scoreCourt(cr);
          const aLabel = sideLabel(cr.team_a_player1_id, cr.team_a_player2_id);
          const bLabel = sideLabel(cr.team_b_player1_id, cr.team_b_player2_id);
          return `<div class="court-row">
            <div>
              <div class="court-num">Court ${cr.court_number}</div>
              <div class="side ${winner==='A'?'winner':winner==='B'?'loser':''}">${escQ(aLabel)}</div>
              <div class="side ${winner==='B'?'winner':winner==='A'?'loser':''}">${escQ(bLabel)}</div>
            </div>
            <div class="score">${winner ? `<strong>${setScores}</strong>` : (setScores || 'In progress')}</div>
          </div>`;
        }).join('')}
      </div>
    `).join('');

    showRefreshed();
  }

  function renderPracticeWeek(league, week) {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="big">🏃</div>
        <div class="title">Practice Week</div>
        <div>Teams meet at their own locked time &amp; location — no matches this week.</div>
      </div>`;
    showRefreshed();
  }

  function showEmpty(title, sub) {
    document.getElementById('content').innerHTML = `<div class="empty-state"><div class="title">${escQ(title)}</div><div>${escQ(sub)}</div></div>`;
    showRefreshed();
  }

  function showRefreshed() {
    const now = new Date();
    let h = now.getHours(); const ampm = h>=12?'PM':'AM'; h = h%12||12;
    const m = now.getMinutes().toString().padStart(2,'0');
    document.getElementById('refresh-time').textContent = `${h}:${m} ${ampm}`;
    document.getElementById('refresh-footer').style.display = 'block';
  }

  window.loadResults = loadResults;
  init();
</script>
</body>
</html>
